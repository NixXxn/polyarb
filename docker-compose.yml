services:
  dashboard:
    build: .
    environment:
      ARBOT_PROCESS: dashboard
      ARBOT_DATA_DIR: /data
      ARBOT_SETTINGS_PATH: /data/settings.yaml
      PORT: "8788"
      HOST: 0.0.0.0
    volumes:
      - arb-data:/data
    ports:
      - "8788:8788"
    restart: unless-stopped

  bot:
    build: .
    environment:
      ARBOT_PROCESS: bot
      ARBOT_DATA_DIR: /data
      ARBOT_SETTINGS_PATH: /data/settings.yaml
    volumes:
      - arb-data:/data
    restart: unless-stopped

volumes:
  arb-data:
